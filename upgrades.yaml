migration:
  type: gamemode
  title: Migration
  desc: Migrate from world to world, stripping each of resources and relics before you get overrun.

relichunt:
  type: gamemode
  modifiers: [difficulty]

prestige:
  type: gamemode
  scenes:
    hud: content/gamemode/prestige/PrestigeScoreHud.tscn
  propertyChanges: 
    - prestige.score = 0.0/h
    - prestige.sentiron = 0/h
    - prestige.sentwater = 0/h
    - prestige.sentcobalt = 0/h
    - prestige.provokedwavestrength = 1.0/h
    - prestige.provokedwavestrengthadditive = 0/h
prestigeIron:
  excludelimit: [prestige-provocation]
  cost: iron=2
  predecessors: [prestige]
  repeatable:
    - cost.iron += 2
  propertyChanges: 
    - prestige.baseperwave += 1.0
    - prestige.sentiron += 1/h
prestigeWater:
  excludelimit: [prestige-provocation, prestige-miner]
  cost: water=1
  predecessors: [prestige]
  repeatable:
    - cost.water += 1
  propertyChanges: 
    - prestige.baseperwave += 1.0
    - prestige.sentwater += 1/h
prestigewatermultiplier:
  limit: [prestige-miner]
  cost: water=1
  predecessors: [prestige]
  repeatable:
    - cost.water += 1
  propertyChanges: 
    - prestige.multiplier += 1.0
    - prestige.sentwater += 1/h prestigewatermultiplier
prestigecobalt:
  excludelimit: [prestige-provocation, prestige-countdown]
  cost: sand=2
  predecessors: [prestige]
  repeatable:
  propertyChanges:
    - prestige.multiplier += 1.0
    - prestige.sentcobalt += 2/h
prestigecobaltcountdown:
  limit: [prestige-countdown]
  shadowing: prestigecobalt
  cost: sand=2
  predecessors: [prestige]
  repeatable:
    - cost.sand += 1
  propertyChanges:
    - prestige.multiplier += 1.0
    - prestige.sentcobalt += 2/h
prestigeFinish:
  limit: [hostile]
  excludelimit: [prestige-countdown]
  cost: iron=30,sand=2
  predecessors: [prestigeIron]
  propertyChanges: 
    - prestige.score *= 2.0
    - upgrade.gameover = true
prestigespeedup:
  limit: [prestige-pro, hostile]
  cost: iron=0
  predecessors: [prestigeWater]
  repeatable:
    - times = 10
    - cost.iron += 0
  propertyChanges:
    - game.cyclespeed *= 0.75
prestigeprovoke:
  limit: [prestige-provocation, between_waves]
  cost: water=1
  predecessors: [prestige]
  repeatable:
    - property.prestige.provokedwavestrength *= 1.2
  propertyChanges:
    - prestige.provokedwavestrengthadditive += 20.0
    - prestige.provokedwavestrength += 0.1
    - prestige.multiplier += 1.0
prestigeIronProvocation:
  limit: [prestige-provocation, between_waves]
  shadowing: prestigeiron
  cost: iron=1
  predecessors: [prestige]
  repeatable:
    - cost.iron += 1
  propertyChanges: 
    - prestige.baseperwave += 10.0
    - prestige.sentiron += 1/h
prestigespeedupprovocation:
  limit: [prestige-pro, hostile, domehealth]
  shadowing: prestigespeedup
  cost: iron=0
  predecessors: [prestigeprovoke]
  repeatable:
    - times = 10
    - cost.iron += 0
  propertyChanges:
    - game.cyclespeed *= 0.75

